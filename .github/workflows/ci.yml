# Continuous integration (CI).
#
# GitHub Actions reads this file and, on every push, starts fresh virtual
# machines that install the project and run the same checks we run locally:
# ruff, pyright and pytest. A green tick on GitHub means the code works on
# machines other than yours.

name: CI

# When to run: pushes to main, pull requests, and the "Run workflow" button
# on the Actions tab (that is what workflow_dispatch enables).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This workflow only needs to read the code, never to change the repository.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    # A "matrix" runs the same steps once for every combination below:
    # 3 operating systems x 2 Python versions = 6 jobs.
    # 3.11 is the oldest Python we support; 3.14 is the one used for development.
    strategy:
      fail-fast: false   # let every job finish, so one failure doesn't hide others
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip                           # reuse downloaded packages between runs
          cache-dependency-path: pyproject.toml

      # Linux CI machines have no screen and lack a few libraries Qt loads.
      # "offscreen" tells Qt to draw windows in memory instead of on a display.
      - name: Prepare Qt (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      - name: Install the project and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (pyright)
        run: pyright

      - name: Test (pytest)
        run: pytest -q -m "not slow"
