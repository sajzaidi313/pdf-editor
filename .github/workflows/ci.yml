# Continuous integration (CI).
#
# GitHub Actions reads this file and, on every push, starts fresh virtual
# machines that install the project and run the same checks we run locally:
# ruff, pyright and pytest. A green tick on GitHub means the code works on
# machines other than yours.

name: CI

# When to run: pushes to main, pull requests, and the "Run workflow" button
# on the Actions tab (that is what workflow_dispatch enables).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This workflow only needs to read the code, never to change the repository.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    # A "matrix" runs the same steps once for every combination below:
    # 3 operating systems x 2 Python versions = 6 jobs.
    # 3.11 is the oldest Python we support; 3.14 is the one used for development.
    strategy:
      fail-fast: false   # let every job finish, so one failure doesn't hide others
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip                           # reuse downloaded packages between runs
          cache-dependency-path: pyproject.toml

      # Linux CI machines have no screen and lack a few libraries Qt loads.
      # "offscreen" tells Qt to draw windows in memory instead of on a display.
      - name: Prepare Qt (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      - name: Install the project and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (pyright)
        run: pyright

      - name: Test (pytest)
        run: pytest -q -m "not slow"

  # Build the stand-alone app with PyInstaller and run it once.
  # The tests above run from source, where every library is simply
  # installed. The packaged app only has what PyInstaller copied into its
  # folder, so a missing Qt plugin or MuPDF file shows up here and nowhere
  # else. `--self-test` opens a PDF bundled with the app, draws page 1 in
  # memory and exits with code 0 when that worked (docs/08 §7).
  package:
    name: Package, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"               # the version used for development
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Prepare Qt (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      - name: Install the project and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Build the app (PyInstaller, one folder)
        run: pyinstaller packaging/pdfeditor.spec --noconfirm

      # shell: bash makes this one line work on all three systems (on
      # Windows, bash finds pdfeditor.exe by itself). A non-zero exit code
      # fails the job.
      - name: Run the built app's self-test
        shell: bash
        run: ./dist/pdfeditor/pdfeditor --self-test
